[project]
name = "islandmart-db"
version = "0.1.0"
description = "Postgres + pgAdmin in Docker, with a Python ETL loader (pandas + SQLAlchemy)"
readme = "README.md"
authors = [
    { name = "StephyRukundoKeza", email = "kezastephy098@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.28",
    "dagster-dbt>=0.29.28",
    "dagster-dlt>=0.29.28",
    "dagster-webserver>=1.13.28",
    "dlt[duckdb,sql-database]>=1.31.0",
    "duckdb>=1.4,<2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.1",
]
